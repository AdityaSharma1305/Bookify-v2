<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your Bookify Password</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #FAFAF8; margin: 0; padding: 20px; color: #1A1A2E; }
        .container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; border: 1px solid #E5E7EB; }
        .logo { font-size: 28px; font-weight: bold; color: #1A1A2E; margin-bottom: 24px; text-align: center; }
        .logo span { color: #E85D26; }
        h2 { color: #1A1A2E; margin-top: 0; font-size: 22px; }
        p { color: #4B5563; font-size: 15px; line-height: 1.6; }
        .btn-container { text-align: center; margin: 32px 0; }
        .btn { background-color: #1A1A2E; color: #ffffff !important; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; display: inline-block; }
        .footer { font-size: 13px; color: #9CA3AF; text-align: center; margin-top: 32px; border-top: 1px solid #F3F4F6; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Book<span>ify</span></div>
        <h2>Password Reset Request</h2>
        <p>Hello <span th:text="${name}">Reader</span>,</p>
        <p>We received a request to reset your password. Click the button below to choose a new password. This link will expire in 2 hours.</p>
        <div class="btn-container">
            <a class="btn" th:href="${resetUrl}">Reset Password</a>
        </div>
        <p>If you didn't request a password reset, please ignore this email.</p>
        <div class="footer">
            <p>&copy; 2026 Bookify. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
